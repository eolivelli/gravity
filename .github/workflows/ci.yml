name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run tests
        run: mvn -B --no-transfer-progress verify

  snapshots:
    name: Render views headless
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Xvfb and GTK
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgl1 libxtst6 libxxf86vm1
      - name: Render black hole views
        run: xvfb-run -a -s "-screen 0 1280x860x24" mvn -B --no-transfer-progress -q javafx:run
        env:
          GRAVITY_SNAPSHOT_DIR: snapshots/black-hole
      - name: Render neutron star views
        run: xvfb-run -a -s "-screen 0 1280x860x24" mvn -B --no-transfer-progress -q javafx:run
        env:
          GRAVITY_SNAPSHOT_DIR: snapshots/neutron-star
          GRAVITY_RADIUS_RS: '2.4'
      - name: Check that every view produced an image
        run: |
          ls -la snapshots/*/
          test "$(ls snapshots/black-hole/*.png | wc -l)" -eq 5
          test "$(ls snapshots/neutron-star/*.png | wc -l)" -eq 5
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/
